name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Analyze, format, test, pana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Install pana
        run: dart pub global activate pana

      - name: Pana
        run: pana --no-warning --exit-code-threshold 20
